acceptance:
  - 1060工单preview：先展示Gate(1028)批次，再展示Scan占位组（标注依赖对应Gate）
  - 1052/1053：若目标存活→stat=7（核验未修复），不可达→stat=6（核验修复）
  - 1050/1051：Gate存活一致后才做技术结论；不存活→stat=10且无二次Scan
  - Gate完成后：存活的1050/1051才动态生成Scan子任务；若无存活Scan不生成
  - 台账：外壳logType=1060，内层srcMethod为1028（Gate）/1020…/1021/1061（Scan）
